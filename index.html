<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#121923"><title>BETA SPEED — Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}main{max-width:480px;margin:auto;padding:14px}header,.stats,.controls{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:26px;letter-spacing:3px;color:#d5ff4f;margin:0}small{color:#b7c2d2}.stats{margin:10px 0;font-variant-numeric:tabular-nums}.stats strong{font-size:22px}.wall{position:relative;height:min(58vh,520px);min-height:340px;border:2px solid #556172;border-radius:16px;background:repeating-linear-gradient(0deg,#303b4a 0 56px,#384455 57px 59px);overflow:hidden}svg{width:100%;height:100%}.controls{margin-top:12px}.controls button{flex:1;height:90px;font-size:22px;font-weight:900;border:0;border-radius:16px;background:#d5ff4f;color:#111722;touch-action:manipulation}.controls button:active{transform:scale(.96);background:#fff}.secondary{background:#263345;color:white;border:1px solid #65738a;border-radius:10px;padding:10px 16px;font-weight:bold}#status{text-align:center;min-height:28px;margin:10px 0;color:#d5ff4f;font-weight:700}.hint{text-align:center;font-size:13px;color:#b7c2d2;line-height:1.6}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101722b9;text-align:center;padding:20px}.overlay.hidden{display:none}.overlay h2{font-size:35px;margin:10px 0}.overlay button{border:0;background:#d5ff4f;color:#121923;font-size:20px;font-weight:bold;padding:15px 30px;border-radius:12px}.target{animation:pulse .55s infinite alternate}@keyframes pulse{from{opacity:.45}to{opacity:1}}</style></head><body><main><header><h1>BETA<span style="color:white"> SPEED</span></h1><button class="secondary" id="reset">RESET</button></header><div class="stats"><div><small>TIME</small><br><strong id="time">0.00s</strong></div><div><small>BEST</small><br><strong id="best">--</strong></div><div><small>HEIGHT</small><br><strong id="height">0 / 15m</strong></div></div><div class="wall"><svg viewBox="0 0 320 520" preserveAspectRatio="none" id="svg" aria-label="クライミングウォール"><g id="holds"></g><g id="climber"></g><text x="160" y="25" text-anchor="middle" fill="#d5ff4f" font-size="17" font-weight="bold">TOP ▲</text></svg><div class="overlay" id="overlay"><div><h2 id="overlayTitle">BETA SPEED</h2><p id="overlayText">左右の手を交互にタップ！<br>光るタイミングで押すと加速する。</p><button id="start">START</button></div></div></div><div id="status">STARTで挑戦！</div><div class="controls"><button id="left">LEFT ◀</button><button id="right">RIGHT ▶</button></div><p class="hint">次に動かす手は光るホールドで確認。<br>タイミングが合えば PERFECT、早すぎると失速。<br>15mを登り切ってベストタイムを更新しよう。</p></main><script>
const $=id=>document.getElementById(id), svgNS='http://www.w3.org/2000/svg';let step=0,started=false,finished=false,startAt=0,lastMove=0,penalty=0,raf=0, best=Number(localStorage.getItem('betaSpeedBest')||0), flash='';const total=20, holds=$('holds'),climber=$('climber');$('best').textContent=best?best.toFixed(2)+'s':'--';const xFor=i=>i%2===0?105:215;const yFor=i=>490-i*22.5;function el(tag,attrs,parent){let n=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}function render(){holds.innerHTML='';for(let i=0;i<=total;i++){let x=xFor(i),y=yFor(i);el('ellipse',{cx:x,cy:y,rx:21,ry:10,fill:i<step?'#64748b':i===step?'#d5ff4f':'#fb7658',stroke:i===step?'white':'#ffd3bf','stroke-width':i===step?3:1,class:i===step?'target':''},holds)}climber.innerHTML='';let anchor=Math.max(0,step-1),cx=160,cy=Math.max(60,yFor(anchor)+35);el('line',{x1:cx,y1:cy-10,x2:xFor(anchor),y2:yFor(anchor),stroke:'#d5ff4f','stroke-width':7,'stroke-linecap':'round'},climber);el('line',{x1:cx,y1:cy-10,x2:xFor(Math.max(0,anchor-1)),y2:yFor(Math.max(0,anchor-1)),stroke:'#d5ff4f','stroke-width':6,'stroke-linecap':'round'},climber);el('line',{x1:cx,y1:cy+12,x2:cx-24,y2:cy+49,stroke:'#7dd3fc','stroke-width':8,'stroke-linecap':'round'},climber);el('line',{x1:cx,y1:cy+12,x2:cx+24,y2:cy+49,stroke:'#7dd3fc','stroke-width':8,'stroke-linecap':'round'},climber);el('line',{x1:cx,y1:cy-10,x2:cx,y2:cy+16,stroke:'#7dd3fc','stroke-width':19,'stroke-linecap':'round'},climber);el('circle',{cx:cx,cy:cy-29,r:17,fill:'#ffcf9d'},climber);el('path',{d:`M ${cx-17} ${cy-32} Q ${cx} ${cy-58} ${cx+18} ${cy-34}`,stroke:'#e96d50','stroke-width':10,fill:'none'},climber);$('height').textContent=(step*.75).toFixed(2).replace(/\.00$/,'')+' / 15m'}function tick(){if(!started)return;$('time').textContent=((performance.now()-startAt+penalty)/1000).toFixed(2)+'s';raf=requestAnimationFrame(tick)}function begin(){cancelAnimationFrame(raf);step=0;penalty=0;started=true;finished=false;startAt=performance.now();lastMove=startAt-360;$('overlay').classList.add('hidden');$('status').textContent='GO!  LEFTからスタート';render();tick()}function move(side){if(!started||finished)return;let required=step%2===0?'left':'right';if(side!==required){penalty+=400;$('status').textContent='WRONG HAND! +0.40s';return}let now=performance.now(),delta=now-lastMove;if(delta<185){penalty+=300;$('status').textContent='TOO EARLY! +0.30s';return}let quality=Math.abs(delta-360);if(quality<75){$('status').textContent='PERFECT!';}else if(quality<170){$('status').textContent='GOOD!'}else{penalty+=160;$('status').textContent='SLOW! +0.16s'}lastMove=now;step++;render();if(step>=total){finished=true;started=false;cancelAnimationFrame(raf);let t=(now-startAt+penalty)/1000;$('time').textContent=t.toFixed(2)+'s';if(!best||t<best){best=t;localStorage.setItem('betaSpeedBest',best);$('best').textContent=best.toFixed(2)+'s';$('overlayTitle').textContent='NEW BEST!'}else $('overlayTitle').textContent='TOP!';$('overlayText').textContent=`FINISH ${t.toFixed(2)}s`; $('start').textContent='RETRY';$('overlay').classList.remove('hidden');$('status').textContent='完登！'}}$('left').addEventListener('pointerdown',e=>{e.preventDefault();move('left')});$('right').addEventListener('pointerdown',e=>{e.preventDefault();move('right')});$('start').onclick=begin;$('reset').onclick=()=>{started=false;cancelAnimationFrame(raf);$('overlayTitle').textContent='BETA SPEED';$('overlayText').textContent='左右交互にタップして15mを登ろう';$('start').textContent='START';$('overlay').classList.remove('hidden');$('time').textContent='0.00s';step=0;render()};document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move('left');if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move('right')});render();</script></body></html>
